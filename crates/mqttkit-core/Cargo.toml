[package]
name = "mqttkit-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mqttkit-ipc.workspace = true
mqttkit-config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
rumqttc.workspace = true
rhai.workspace = true
base64 = "0.22"
# TLS 自签证书放行（verify_hostname=false）所需的自定义 ClientConfig 路径
# rustls 0.23.43+ 已移除 dangerous_configuration feature——builder 直接提供
# `.dangerous().with_custom_certificate_verifier(..)`，无需 feature gate
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
http = "1"
# v5 publish 的 payload 参数是 Into<Bytes>
bytes = "1"
