[package]
name = "mqttrustui"
version = "0.1.0"
description = "轻量级跨平台 MQTT 桌面客户端"
authors = ["MqttRustUI"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

# Tauri 2 的二进制入口在 src/main.rs；产物名即应用名
default-run = "mqttrustui"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "menu"] }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }

mqttkit-core = { workspace = true }
mqttkit-config = { workspace = true }
mqttkit-ipc = { workspace = true }

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
uuid.workspace = true
anyhow = "1"
regex = "1"

[features]
# 默认不启用 devtools；发布构建自动剥离
default = []
